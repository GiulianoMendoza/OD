<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día de la Primavera</title>
<style>
  :root { color-scheme: light; --ground-h: 7vh; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow-x: hidden;
    overscroll-behavior: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
  }

  .scene {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    perspective: 600px;
    background: linear-gradient(180deg, #bfe3f8 0%, #eaf6ee 45%, #fdf6e3 100%);
    background-size: 100% 220%;
    animation: sky-drift 40s ease-in-out infinite alternate;
  }

  @keyframes sky-drift {
    from { background-position: 0 0%; }
    to   { background-position: 0 100%; }
  }

  .sun {
    position: absolute;
    top: -12vh; right: -8vw;
    width: 48vw; height: 48vw;
    max-width: 320px; max-height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,244,183,.9), rgba(255,244,183,0) 70%);
    animation: sun-pulse 6s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes sun-pulse {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1;  transform: scale(1.08); }
  }

  .cloud {
    position: absolute;
    top: var(--top, 8%);
    left: -30%;
    width: var(--w, 40vw);
    height: var(--h, 10vw);
    background: radial-gradient(ellipse, rgba(255,255,255,.85), rgba(255,255,255,0) 70%);
    filter: blur(2px);
    animation: drift var(--dur, 50s) linear infinite;
    animation-delay: var(--delay, 0s);
    z-index: 0;
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(160vw); }
  }

  h1 {
    position: relative;
    z-index: 5;
    text-align: center;
    color: #3f7d4d;
    font-size: clamp(1.6rem, 7vw, 3rem);
    font-weight: 700;
    padding: 9vh 6vw 0;
    margin: 0;
    letter-spacing: .3px;
    text-shadow: 0 2px 10px rgba(255,255,255,.85);
    opacity: 0;
    transform: translateY(-10px);
    animation: title-in 1.4s ease-out .3s forwards, title-breathe 5s ease-in-out 1.8s infinite;
  }
  @keyframes title-in {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes title-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.025); }
  }

  .credit {
    position: relative;
    z-index: 5;
    text-align: center;
    color: #4b7a56;
    opacity: 0;
    font-size: .85rem;
    padding: 1.5vh 5vw 3vh;
    animation: title-in 1.4s ease-out 1.1s forwards;
  }

  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: var(--ground-h);
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, #a8d48a 0%, #7cb668 60%, #689f57 100%);
    box-shadow: 0 -6px 18px rgba(60,110,50,.15) inset;
    z-index: 1;
  }

  .blade {
    position: absolute;
    bottom: var(--ground-h);
    left: var(--bx);
    width: var(--bw);
    height: 0;
    background: linear-gradient(180deg, #8fce6f, #5a9a4d);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    transform-origin: bottom center;
    animation: grow-blade var(--bgrow) ease-out forwards,
               sway var(--bsway) ease-in-out infinite;
    animation-delay: 0s, var(--bgrow);
    z-index: 2;
    pointer-events: none;
  }
  @keyframes grow-blade {
    from { height: 0; }
    to   { height: var(--bh); }
  }

  .flower {
    position: absolute;
    bottom: var(--ground-h);
    left: var(--x);
    width: var(--size);
    height: calc(var(--size) * 2.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    transform-origin: bottom center;
    opacity: var(--depth-opacity, 1);
    filter: blur(var(--depth-blur, 0)) brightness(var(--depth-bright, 1));
    animation: sway var(--sway-dur, 7s) ease-in-out infinite;
    animation-delay: var(--stem-dur);
    z-index: var(--z, 2);
    pointer-events: none;
  }

  .stem {
    position: relative;
    width: max(3px, calc(var(--size) * .055));
    height: 0;
    background: linear-gradient(180deg, #7bc47f, #3f8f4c);
    border-radius: 4px;
    animation: grow-stem var(--stem-dur) cubic-bezier(.22,.7,.3,1) forwards;
  }
  @keyframes grow-stem {
    from { height: 0; }
    to   { height: calc(var(--size) * 1.65); }
  }

  .bloom {
    position: relative;
    width: var(--size);
    height: var(--size);
    margin-bottom: -2px;
    opacity: 0;
    transform: scale(0) rotate(-16deg);
    animation: bloom .9s cubic-bezier(.3,1.4,.5,1) forwards;
    animation-delay: var(--stem-dur);
    transform-style: preserve-3d;
  }
  @keyframes bloom {
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  .bloom::before {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 160%; height: 160%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--petal-color) 0%, transparent 68%);
    filter: blur(calc(var(--size) * .18));
    opacity: .55;
    z-index: -1;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-2.5deg); }
    50%      { transform: rotate(2.5deg); }
  }

  .petal {
    position: absolute;
    top: 50%; left: 50%;
    width: 46%;
    height: 62%;
    background: var(--petal-color);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transform-origin: 50% 100%;
    box-shadow: 0 0 6px rgba(0,0,0,.05) inset;
  }
  .petal:nth-child(1) { transform: translate(-50%,-100%) rotate(0deg)   rotateX(18deg); }
  .petal:nth-child(2) { transform: translate(-50%,-100%) rotate(60deg)  rotateX(18deg); }
  .petal:nth-child(3) { transform: translate(-50%,-100%) rotate(120deg) rotateX(18deg); }
  .petal:nth-child(4) { transform: translate(-50%,-100%) rotate(180deg) rotateX(18deg); }
  .petal:nth-child(5) { transform: translate(-50%,-100%) rotate(240deg) rotateX(18deg); }
  .petal:nth-child(6) { transform: translate(-50%,-100%) rotate(300deg) rotateX(18deg); }
  .flower--rosa .petal { border-radius: 50%; }

  .center {
    position: absolute;
    top: 50%; left: 50%;
    width: 30%; height: 30%;
    background: var(--center-color);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    box-shadow: inset 0 0 5px rgba(0,0,0,.18);
  }

  .leaf {
    position: absolute;
    bottom: 32%;
    width: calc(var(--size) * .24);
    height: calc(var(--size) * .13);
    background: #5fae63;
    border-radius: 0 100% 0 100%;
    opacity: 0;
    animation: leaf-in .5s ease-out forwards;
    animation-delay: calc(var(--stem-dur) * .55);
  }
  .leaf--l { left: calc(var(--size) * -.08); transform: rotate(20deg) scaleX(-1); }
  .leaf--r { right: calc(var(--size) * -.08); transform: rotate(-20deg); }
  @keyframes leaf-in {
    from { opacity: 0; transform: scale(0); }
    to   { opacity: 1; transform: scale(1); }
  }

  .pollen {
    position: absolute;
    bottom: -2vh;
    left: var(--px);
    width: var(--psize);
    height: var(--psize);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,241,168,.95), rgba(255,241,168,0) 75%);
    opacity: 0;
    animation: float-up var(--pdur) ease-in forwards;
    z-index: 3;
    pointer-events: none;
  }
  @keyframes float-up {
    0%   { opacity: 0; transform: translate(0,0); }
    10%  { opacity: .8; }
    90%  { opacity: .5; }
    100% { opacity: 0; transform: translate(var(--pdrift), -100vh); }
  }

  @media (min-width: 700px) {
    h1 { padding-top: 7vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scene, .sun, .cloud, h1, .flower, .pollen, .blade { animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="sun"></div>
    <h1>🌼 Feliz Día de la Primavera 🌼</h1>
    <p class="credit">Ousi Old les desea feliz Día de la Primavera</p>
    <div class="ground"></div>
  </div>

<script>
(function () {
  const scene = document.getElementById('scene');

  // paleta calma y armónica: pasteles cálidos de primavera
  const TYPES = [
    { name: 'girasol', petals: 6, petal: '#ffcf5c', center: '#8a5a3c', sizeMin: 70, sizeMax: 120 },
    { name: 'amarilla', petals: 6, petal: '#ffe066', center: '#e7a33d', sizeMin: 55, sizeMax: 95 },
    { name: 'rosa',     petals: 5, petal: '#ffb4c6', center: '#ffe066', sizeMin: 45, sizeMax: 78 },
    { name: 'jazmin',   petals: 6, petal: '#fffaf0', center: '#f6c453', sizeMin: 32, sizeMax: 58 },
    { name: 'lila',     petals: 5, petal: '#c9a6e0', center: '#fff3b0', sizeMin: 38, sizeMax: 66 },
    { name: 'durazno',  petals: 5, petal: '#ffc9a8', center: '#ff9466', sizeMin: 40, sizeMax: 70 },
  ];

  // nubes de fondo, lentas
  [{top:'6%',w:'46vw',h:'11vw',dur:'55s',delay:'0s'},
   {top:'16%',w:'34vw',h:'8vw', dur:'70s',delay:'-20s'},
   {top:'3%', w:'28vw',h:'7vw', dur:'46s',delay:'-8s'}]
  .forEach(c => {
    const el = document.createElement('div');
    el.className = 'cloud';
    el.style.setProperty('--top', c.top);
    el.style.setProperty('--w', c.w);
    el.style.setProperty('--h', c.h);
    el.style.setProperty('--dur', c.dur);
    el.style.setProperty('--delay', c.delay);
    scene.appendChild(el);
  });

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // pasto creciendo al fondo, una sola vez al cargar
  for (let i = 0; i < 34; i++) {
    const el = document.createElement('div');
    el.className = 'blade';
    el.style.setProperty('--bx', rand(0, 98) + 'vw');
    el.style.setProperty('--bw', rand(4, 8) + 'px');
    el.style.setProperty('--bh', rand(18, 42) + 'px');
    el.style.setProperty('--bgrow', rand(1.5, 3.2).toFixed(2) + 's');
    el.style.setProperty('--bsway', rand(3.5, 6).toFixed(2) + 's');
    scene.appendChild(el);
  }

  const MAX_ALIVE = 14;
  let alive = 0;

  function spawnFlower(opts) {
    opts = opts || {};
    if (alive >= MAX_ALIVE) return;
    const type = opts.type || pick(TYPES);
    const size = opts.size || rand(type.sizeMin, type.sizeMax);
    const x = opts.x != null ? opts.x : rand(2, 90);
    const depth = rand(.55, 1);
    const stemDur = rand(1.3, 2.2).toFixed(2);
    const swayDur = rand(6, 9.5).toFixed(2);

    const el = document.createElement('div');
    el.className = 'flower flower--' + type.name;
    el.style.setProperty('--x', x + 'vw');
    el.style.setProperty('--size', (size * depth) + 'px');
    el.style.setProperty('--stem-dur', stemDur + 's');
    el.style.setProperty('--sway-dur', swayDur + 's');
    el.style.setProperty('--depth-opacity', (.55 + depth * .45).toFixed(2));
    el.style.setProperty('--depth-blur', ((1 - depth) * 2.2).toFixed(2) + 'px');
    el.style.setProperty('--depth-bright', (.88 + depth * .12).toFixed(2));
    el.style.setProperty('--z', Math.round(depth * 10));

    const stem = document.createElement('div');
    stem.className = 'stem';
    const leafL = document.createElement('div');
    leafL.className = 'leaf leaf--l';
    const leafR = document.createElement('div');
    leafR.className = 'leaf leaf--r';
    stem.appendChild(leafL);
    stem.appendChild(leafR);

    const bloom = document.createElement('div');
    bloom.className = 'bloom';
    bloom.style.setProperty('--petal-color', type.petal);
    bloom.style.setProperty('--center-color', type.center);
    for (let i = 0; i < type.petals; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      bloom.appendChild(p);
    }
    const center = document.createElement('div');
    center.className = 'center';
    bloom.appendChild(center);

    el.appendChild(bloom);
    el.appendChild(stem);
    scene.appendChild(el);
    alive++;

    setTimeout(() => { el.remove(); alive--; }, (parseFloat(stemDur) + 40) * 1000);
  }

  function spawnPollen() {
    const el = document.createElement('div');
    const size = rand(4, 9);
    el.className = 'pollen';
    el.style.setProperty('--px', rand(0, 96) + 'vw');
    el.style.setProperty('--psize', size + 'px');
    el.style.setProperty('--pdur', rand(9, 16) + 's');
    el.style.setProperty('--pdrift', rand(-40, 40) + 'px');
    scene.appendChild(el);
    setTimeout(() => el.remove(), 17000);
  }

  // flor amarilla grande, protagonista, centrada al inicio
  setTimeout(() => {
    spawnFlower({ type: TYPES[1], size: 150, x: 50 - (150 / window.innerWidth) * 50 });
  }, 1000);

  // siembra tranquila y continua
  setInterval(() => spawnFlower(), 1700);
  setInterval(spawnPollen, 2200);

  // toque para sembrar una flor donde tocás (suave, no invasivo)
  scene.addEventListener('pointerdown', (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    spawnFlower({ x: x - 4 });
  });
})();
</script>
</body>
</html>
